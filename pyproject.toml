[project]
name = "linden-sec-master"
version = "0.1.0"
description = "C.A.S.M security master (Phase 1 prototype)"
requires-python = ">=3.12,<3.15"
authors = [
  { name = "Mohit Choudhary" },
]
dependencies = [
  "pydantic>=2.7.0",
  "openpyxl>=3.1.0",
  "duckdb>=1.0.0",
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.6.0",
  "pytest>=8.0.0",
  "httpx>=0.27,<1",
]

[project.scripts]
casm = "casm.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["casm*"]

[tool.black]
line-length = 90
target-version = ["py312"]

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = ["docs/"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
]
ignore = [
  "E501", # line length is black's job; black won't wrap strings/comments, so let it own this
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
testpaths = [
  "tests",
]
